[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsage"
version = "0.1.0"
description = "Local LLM powered Git commit generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pyperclip",
    "toml",
]

[project.scripts]
gitsage = "gitsage.cli:main"